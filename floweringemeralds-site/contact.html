<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact ⋅ Flowering Emeralds</title>
<meta name="description" content="Get in touch on Discord." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="bokeh" aria-hidden="true">
    <div class="orb" style="width:110px;height:110px;top:10%;left:8%;animation-delay:0s;"></div>
    <div class="orb blue" style="width:140px;height:140px;top:65%;left:85%;animation-delay:3s;"></div>
    <div class="orb gold" style="width:60px;height:60px;top:30%;left:80%;animation-delay:1.5s;"></div>
    <div class="orb" style="width:80px;height:80px;top:78%;left:10%;animation-delay:2.5s;"></div>
  </div>

  <div class="nav-wrap">
    <nav class="nav glass">
      <a href="index.html" class="brand"><span class="leaf-dot" aria-hidden="true"></span> Emerald trees</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </div>

  <main>
    <div class="contact-wrap">
      <div class="contact-card glass">
        <div class="contact-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.6 12.6 0 0 0-.617-1.25.077.077 0 0 0-.079-.037 19.74 19.74 0 0 0-4.885 1.515.07.07 0 0 0-.032.028C.533 9.09-.32 13.579.099 18.021a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.927 1.793 8.18 1.793 12.061 0a.073.073 0 0 1 .079.01c.12.099.246.197.373.291a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.106c.36.699.772 1.364 1.225 1.994a.077.077 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.637-3.548-13.625a.06.06 0 0 0-.031-.028ZM8.02 15.331c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.211 0 2.176 1.094 2.157 2.418 0 1.334-.955 2.419-2.157 2.419Zm7.974 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.211 0 2.176 1.094 2.157 2.418 0 1.334-.946 2.419-2.157 2.419Z" fill="#fff"/>
          </svg>
        </div>
        <h1>Find me in the glade</h1>
        <p class="sub">Drop by and say hi — I don't bite, promise.</p>

        <div class="discord-pill">
          <div>
            <span class="label">Discord</span>
            <span class="handle" id="discord-handle">@floweringemeralds</span>
          </div>
          <button class="copy-btn" id="copy-btn" type="button">Copy</button>
        </div>
        <p class="copy-note" id="copy-note" role="status" aria-live="polite"></p>
      </div>
    </div>
  </main>

  <footer>
    Where are you now?
  </footer>

  <script>
    const btn = document.getElementById('copy-btn');
    const note = document.getElementById('copy-note');
    const handle = document.getElementById('discord-handle').textContent;

    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(handle);
        note.textContent = 'Copied to clipboard ✨';
      } catch (err) {
        note.textContent = handle;
      }
      setTimeout(() => { note.textContent = ''; }, 2200);
    });
  </script>

</body>
</html>
